plugins { id 'com.android.application' }

def mobileWebAssets = layout.buildDirectory.dir('generated/mobileWebAssets')
def syncMobileWebAssets = tasks.register('syncMobileWebAssets', Sync) {
    from(rootProject.file('../../static')) { include 'mobile.css', 'mobile.js' }
    into(mobileWebAssets)
    doFirst {
        ['mobile.css', 'mobile.js'].each { name ->
            if (!rootProject.file("../../static/${name}").isFile()) {
                throw new GradleException("Missing mobile web asset: static/${name}")
            }
        }
    }
}

android {
    namespace 'com.charles.monitor'
    compileSdk 35
    defaultConfig {
        applicationId 'com.charles.monitor'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.1.8-prototype'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    sourceSets.main.assets.srcDir(mobileWebAssets)
}
tasks.named('preBuild').configure { dependsOn(syncMobileWebAssets) }
dependencies {
    implementation files('libs/monitor-tunnel.aar')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // These are ZXing 4.3.0's own dependencies, omitted from its published POM.
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
