plugins { id 'com.android.application' }

android {
    namespace 'com.charles.monitor'
    compileSdk 35
    defaultConfig {
        applicationId 'com.charles.monitor'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.1.5-prototype'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation files('libs/monitor-tunnel.aar')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // These are ZXing 4.3.0's own dependencies, omitted from its published POM.
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.6'
    testImplementation 'junit:junit:4.13.2'
}
