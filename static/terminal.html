<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f7f6">
    <title>Web Terminal · iLab Server Monitor</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/selects.css">
    <link rel="stylesheet" href="/static/vendor/xterm.css">
    <link rel="stylesheet" href="/static/terminal.css">
    <script src="/static/sites.js" defer></script>
    <script src="/static/vendor/xterm.js" defer></script>
    <script src="/static/vendor/xterm-addon-fit.js" defer></script>
    <script src="/static/terminal-mobile.js" defer></script>
    <script src="/static/terminal.js" defer></script>
    <link rel="stylesheet" href="/static/typography.css">
    <link rel="stylesheet" href="/static/terminal-mobile.css">
  </head>
  <body>
    <header class="terminal-header">
      <a id="terminal-back" class="button back-button" aria-label="返回监控" title="返回监控">←</a>
      <img class="terminal-logo" src="/static/favicon.svg" width="32" height="32" alt="iLab">
      <div class="terminal-context"><h1 id="terminal-title">Web Terminal</h1><p id="terminal-task">正在读取任务信息…</p></div>
      <span class="site-badge" data-site-label></span>
      <a id="terminal-official" class="official-link" target="_blank" rel="noopener noreferrer" hidden>云控制台 ↗</a>
    </header>
    <div id="terminal-setup" class="terminal-setup">
      <div class="session-welcome"><div class="welcome-icon"><svg class="session-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 6 6-6 6M13 18h6"/></svg></div><span class="welcome-eyebrow">ILAB WORKSPACE / TERMINAL</span><h2>连接任务终端</h2><p>选择运行实例，在当前页面使用交互式 Shell。</p><div class="welcome-tags"><span>CCI / ACP</span><span>实时输入输出</span><span>支持移动端</span></div></div>
    <div class="connection-bar">
      <div class="session-status"><p id="terminal-status" data-state="loading" role="status" aria-live="polite">正在读取最新实例与容器…</p><button id="terminal-retry" class="button" type="button" hidden>重新连接</button></div>
      <details id="terminal-connection">
        <summary>连接设置</summary>
        <div id="terminal-picker" hidden>
          <div class="target-field"><label id="terminal-instance-label" for="terminal-instance">实例</label><select id="terminal-instance" class="terminal-select"></select></div>
          <div id="terminal-container-field" class="target-field"><label id="terminal-container-label" for="terminal-container">容器</label><select id="terminal-container" class="terminal-select"></select></div>
          <button id="terminal-open" class="button primary" type="button">连接终端</button>
        </div>
      </details>
    </div>
    </div>
    <section id="terminal-workspace" class="terminal-workspace" hidden aria-label="交互式终端">
      <div class="terminal-toolbar">
        <a id="terminal-mobile-back" class="button terminal-mobile-back" aria-label="返回监控"><svg class="terminal-ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></a>
        <div class="terminal-session"><svg class="session-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 6 6-6 6M13 18h6"/></svg><span id="terminal-led" class="terminal-led"></span><strong id="terminal-target-name">Terminal</strong><span id="terminal-transport">连接中</span><span id="terminal-size" aria-label="终端列数与行数"></span></div>
        <div id="terminal-tools" class="terminal-tools">
          <button id="terminal-font-down" type="button" title="缩小字号" aria-label="缩小字号">A−</button>
          <button id="terminal-font-up" type="button" title="放大字号" aria-label="放大字号">A＋</button>
          <button id="terminal-copy" type="button">复制选中</button>
          <button id="terminal-paste" type="button">粘贴</button>
          <button id="terminal-fullscreen" type="button">全屏</button>
          <button id="terminal-disconnect" type="button">断开</button>
        </div>
        <div class="terminal-mobile-controls"><span id="terminal-mobile-status" role="status" aria-label="未连接" title="未连接"></span><button id="terminal-mobile-keyboard" type="button" aria-label="显示或收起键盘" title="键盘" aria-pressed="false"><svg class="terminal-ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 15h8"/></svg></button><button id="terminal-more" type="button" aria-label="更多终端工具" title="更多" aria-haspopup="dialog"><svg class="terminal-ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
      </div>
      <div id="terminal-screen" aria-label="命令行输入和输出"><div id="terminal-mount"></div></div>
      <div class="terminal-keyboard" aria-label="终端快捷键">
        <button type="button" data-terminal-key="ctrl" aria-pressed="false">Ctrl</button><button type="button" data-terminal-key="interrupt">Ctrl+C</button><button type="button" data-terminal-key="tab">Tab</button><button type="button" data-terminal-key="escape">Esc</button>
        <button type="button" data-terminal-key="up" aria-label="方向上">↑</button><button type="button" data-terminal-key="down" aria-label="方向下">↓</button>
        <button type="button" data-terminal-key="left" aria-label="方向左">←</button><button type="button" data-terminal-key="right" aria-label="方向右">→</button>
        <button type="button" data-terminal-key="backspace" aria-label="退格">⌫</button><button type="button" data-terminal-key="enter">Enter</button>
      </div>
      <p id="terminal-input-notice" role="status" aria-live="polite"></p>
      <p id="terminal-hint" class="terminal-hint" role="status">断开会关闭当前 Shell，其中的前台命令可能中断。</p>
    </section>

    <dialog id="terminal-menu" aria-labelledby="terminal-menu-title"><div class="terminal-menu-heading"><div><span class="terminal-menu-eyebrow">TERMINAL / WORKSPACE</span><h2 id="terminal-menu-title">终端工具</h2><p id="terminal-menu-target"></p></div><button id="terminal-menu-close" type="button" aria-label="关闭终端工具"><svg class="terminal-ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><div id="terminal-menu-content"></div><a id="terminal-menu-back" class="terminal-menu-back">← 返回监控</a></dialog>
  </body>
</html>
